name: Backfill history
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-prices
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/backfill.py
      - name: Commit
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git add data/price_log.json
          git diff --cached --quiet || (git commit -m "Storico prezzi importato da aion2.exchange (dal 4 ottobre)" && git pull --rebase && git push)
