name: Discord bot
on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Deploy the Worker to Cloudflare
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          # wrangler's output goes into annotations so it can be read without the raw logs
          report() { tail -n 25 "$1" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r l; do echo "::$2::$l"; done; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || echo "::error::secret CLOUDFLARE_API_TOKEN missing"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::error::secret CLOUDFLARE_ACCOUNT_ID missing"
          [ -n "$DISCORD_PUBLIC_KEY" ] || echo "::error::secret DISCORD_PUBLIC_KEY missing"
          # KV namespace for /server (created once, then reused)
          kvid() { npx -y wrangler@4 kv namespace list 2>/dev/null | jq -r '[.[] | select(.title | endswith("bot-users"))][0].id // empty'; }
          id=$(kvid)
          if [ -z "$id" ]; then npx -y wrangler@4 kv namespace create aion-market-bot-users > kv.txt 2>&1 || report kv.txt error; id=$(kvid); fi
          if [ -n "$id" ]; then printf '\n[[kv_namespaces]]\nbinding = "USERS"\nid = "%s"\n' "$id" >> wrangler.toml; else echo "::warning::KV namespace missing: /server disabled"; fi
          npx -y wrangler@4 deploy > deploy.txt 2>&1 || true
          if grep -q 'register a workers.dev subdomain' deploy.txt; then
            # first deploy on this account: create the free *.workers.dev subdomain, then deploy again
            for sub in aion2-market aion2-market-bot aion-market-$RANDOM; do
              r=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$sub\"}")
              echo "::notice::subdomain $sub: $(echo "$r" | jq -c '{success, errors}')"
              echo "$r" | jq -e .success > /dev/null && break
            done
            sleep 10
            npx -y wrangler@4 deploy > deploy.txt 2>&1 || true
          fi
          if ! grep -q 'workers.dev' deploy.txt || grep -q 'ERROR\|register a workers.dev' deploy.txt; then report deploy.txt error; exit 1; fi
          grep -o 'https://[^ ]*workers.dev' deploy.txt | head -1 | sed 's/^/::notice::Worker URL /'
          if ! printf '%s' "$DISCORD_PUBLIC_KEY" | npx -y wrangler@4 secret put DISCORD_PUBLIC_KEY > secret.txt 2>&1; then report secret.txt error; exit 1; fi
          if ! printf '%s' "$DISCORD_TOKEN" | npx -y wrangler@4 secret put DISCORD_TOKEN > secret.txt 2>&1; then report secret.txt error; exit 1; fi
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            if ! printf '%s' "$SUPABASE_SERVICE_KEY" | npx -y wrangler@4 secret put SUPABASE_SERVICE_KEY > secret.txt 2>&1; then report secret.txt error; exit 1; fi
          else echo "::warning::secret SUPABASE_SERVICE_KEY missing: /preferiti will not work"; fi
      - name: Register the slash commands
        run: node bot/register.mjs 2>&1 | tee reg.txt; s=${PIPESTATUS[0]}; [ $s -eq 0 ] || sed 's/^/::error::/' reg.txt; exit $s
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
