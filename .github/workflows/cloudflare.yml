name: Pubblica su Cloudflare (aion2italia.com)
# The Italian site lives on the 'italia-site' branch of this repo and is served by Cloudflare Pages (project 'aion2italia'),
# custom domain aion2italia.com. Static site, no build: only the supabase-js CDN script is moved into lib/ (scripts/selfhost.py).
on:
  push:
    branches: [italia-site]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: aion2italia
      DOMAIN: aion2italia.com
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          python3 scripts/selfhost.py market.html
          mkdir dist
          rsync -a --exclude .git --exclude .github --exclude tools --exclude scripts --exclude CLAUDE.md --exclude README.md ./ dist/
          du -sh dist
      - name: Create the Pages project (once)
        run: npx -y wrangler@3 pages project create "$PROJECT" --production-branch main 2>&1 | tail -3 || true
      - name: Deploy
        run: npx -y wrangler@3 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1 | tail -6
      - name: Custom domain
        run: |
          api() { curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"}; }
          for d in "$DOMAIN" "www.$DOMAIN"; do
            echo "== add $d"; api POST "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" "{\"name\":\"$d\"}" | python3 -c "import json,sys;r=json.load(sys.stdin);print(r.get('success'),r.get('errors'),(r.get('result') or {}).get('status'))"
          done
          # DNS: both names point at the Pages project (proxied CNAME; the apex works through CNAME flattening). Only created when missing.
          ZONE=$(api GET "/zones?name=$DOMAIN" | python3 -c "import json,sys;r=json.load(sys.stdin)['result'];print(r[0]['id'] if r else '')")
          for d in "$DOMAIN" "www.$DOMAIN"; do
            have=$(api GET "/zones/$ZONE/dns_records?name=$d" | python3 -c "import json,sys;print(' '.join(f\"{x['type']}:{x['content']}\" for x in json.load(sys.stdin).get('result') or []))")
            echo "== dns $d: ${have:-none}"
            if [ -z "$have" ]; then api POST "/zones/$ZONE/dns_records" "{\"type\":\"CNAME\",\"name\":\"$d\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | python3 -c "import json,sys;r=json.load(sys.stdin);print('created',r.get('success'),r.get('errors'))"; fi
          done
          sleep 20
          echo "== domains"; api GET "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" | python3 -c "import json,sys;r=json.load(sys.stdin);[print(d['name'],d.get('status'),(d.get('validation_data') or {}).get('status'),(d.get('verification_data') or {}).get('status'),d.get('validation_data',{}).get('error_message')) for d in r.get('result') or []];print(r.get('errors'))"
          echo "== zone"; api GET "/zones?name=$DOMAIN" | python3 -c "import json,sys;r=json.load(sys.stdin);[print(z['name'],z['status'],z.get('name_servers'),z.get('account',{}).get('id')==__import__('os').environ['CLOUDFLARE_ACCOUNT_ID']) for z in r.get('result') or []];print('zones:',len(r.get('result') or []),r.get('errors'))"
          echo "== project"; api GET "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" | python3 -c "import json,sys;r=json.load(sys.stdin);print((r.get('result') or {}).get('subdomain'),r.get('errors'))"
      - name: Check the live site
        run: |
          sleep 30
          for u in https://aion2italia.com/ https://www.aion2italia.com/market.html https://aion2italia.com/market.html https://aion2italia.com/mappa.html https://aion2italia.com/community.html https://aion2italia.com/guide.html https://aion2italia.com/privacy.html https://aion2italia.com/css/base.css https://aion2italia.com/fonts/figtree.woff https://aion2italia.com/nonesiste; do
            printf '%-48s ' "$u"; curl -sL -o /tmp/b -w '%{http_code} %{redirect_url} %{size_download}B ssl=%{ssl_verify_result}\n' "$u" || echo "curl failed"
          done
          echo "== title"; curl -s https://aion2italia.com/ | grep -o '<title>[^<]*' | head -1
          echo "== supabase script in market.html"; src=$(curl -sL https://aion2italia.com/market.html | grep -o 'src="[^"]*supabase[^"]*"' | cut -d'"' -f2); echo "src=$src"
          printf 'script: '; curl -s -o /dev/null -w '%{http_code} %{size_download}B\n' "https://aion2italia.com/$src" || true
          echo "== data from the original site, as the browser asks for it (Origin header)"
          for u in data/servers.json data/s/12305/summary.json data/s/12311/meta.json data/recipes.json data/icons.json data/map/index.json; do
            printf '%-32s ' "$u"; curl -s -o /dev/null -D /tmp/h -w '%{http_code} %{size_download}B ' -H 'Origin: https://aion2italia.com' "https://benzodaeskisumi.github.io/aion-market/$u"; grep -i '^access-control-allow-origin' /tmp/h | tr -d '\r' || echo 'NO CORS'
          done
          echo "== Mauro's character API"
          curl -s -o /dev/null -D /tmp/h -w '%{http_code} ' -H 'Origin: https://aion2italia.com' 'https://aion-market-bot.aion2-market.workers.dev/char/meta'; grep -i '^access-control-allow-origin' /tmp/h | tr -d '\r' || echo 'NO CORS'
          echo "== Supabase: is https://aion2italia.com an allowed login redirect?"
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' 'https://xmtenkcpocwwqcpfhkgr.supabase.co/auth/v1/authorize?provider=discord&redirect_to=https%3A%2F%2Faion2italia.com%2Fmarket.html')
          python3 - "$loc" <<'PY'
          import sys, urllib.parse, base64, json
          q = urllib.parse.parse_qs(urllib.parse.urlparse(sys.argv[1]).query)
          st = (q.get('state') or [''])[0].split('.')
          if len(st) < 2: print('no JWT state; redirect:', urllib.parse.unquote(sys.argv[1])[:400]); sys.exit()
          body = json.loads(base64.urlsafe_b64decode(st[1] + '=' * (-len(st[1]) % 4)))
          print('referrer =', body.get('referrer'), '->', 'OK' if 'aion2italia.com' in str(body.get('referrer')) else 'NOT ALLOWED (falls back to the Site URL)')
          PY
      - name: Open every page in a real browser
        run: |
          npm i --no-save --silent playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/livecheck.mjs
