name: Discord setup
# Sets up the guild's Discord server with the bot. 'plan' only reads and lists what it would do; 'apply' does it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan / apply (struttura) · style-plan / style-apply (grafica) · msg-plan / msg-apply (messaggi di Mauro)'
        required: true
        default: plan
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pillow >/dev/null
      - run: |
          if [[ "$MODE" == banner* ]]; then python3 scripts/discord/banner.py > /tmp/run.txt 2>&1 || true; elif [[ "$MODE" == roles* ]]; then python3 scripts/discord/roles.py > /tmp/run.txt 2>&1 || true; elif [[ "$MODE" == chan* ]]; then python3 scripts/discord/channels.py > /tmp/run.txt 2>&1 || true; elif [[ "$MODE" == msg* ]]; then python3 scripts/discord/messages.py > /tmp/run.txt 2>&1 || true; elif [[ "$MODE" == info* ]]; then python3 scripts/discord/info.py > /tmp/run.txt 2>&1 || true; elif [[ "$MODE" == audit ]]; then python3 scripts/discord/audit.py > /tmp/run.txt 2>&1 || true; elif [[ "$MODE" == style* ]]; then python3 scripts/discord/style.py > /tmp/run.txt 2>&1 || true; else node scripts/discord/setup.mjs > /tmp/run.txt 2>&1 || true; fi
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MODE: ${{ inputs.mode }}
      - name: Save the output on the temporary 'probe' branch
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          cp /tmp/run.txt /tmp/p.txt
          git checkout --orphan probe && git rm -rfq . && cp /tmp/p.txt probe.txt
          git add -A && git commit -qm "discord setup output" && git push -f origin probe
