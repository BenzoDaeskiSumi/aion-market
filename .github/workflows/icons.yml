name: Official icons
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-prices
  cancel-in-progress: false
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/official_icons.py
      - name: Commit
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git add icons data/icons.json data/icons_meta.json
          git diff --cached --quiet || (git commit -m "Icone ufficiali dal dizionario oggetti NCSOFT" && git pull --rebase && git push)
