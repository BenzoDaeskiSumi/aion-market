name: Item database
on:
  schedule:
    - cron: '17 4 * * 3'        # weekly, Wednesday morning (after the usual maintenance)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: item-db
  cancel-in-progress: false
jobs:
  items:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/item_db.py
      - name: Commit
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git add data/db
          git diff --cached --quiet || (git commit -m "Database oggetti dal dizionario ufficiale NCSOFT" && git pull --rebase && git push)
