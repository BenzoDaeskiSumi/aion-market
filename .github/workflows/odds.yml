name: Official odds (KR)
# NCSOFT's probability disclosure for the Korean service -> data/odds (only when NCSOFT publishes a new version)
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'rifai anche se la versione è la stessa (yes/no)'
        default: 'no'
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: odds
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # the tables are big: they live on the 'odds' branch (one commit, replaced), merged in by 'Publish site'
      - run: |
          git fetch -q origin odds && git show origin/odds:data/odds/index.json > /tmp/old.json 2>/dev/null && mkdir -p data/odds && cp /tmp/old.json data/odds/index.json || true
      - run: node scripts/odds_import.mjs ${{ inputs.force == 'yes' && '--force' || '' }} | tee /tmp/odds.log
      - name: Replace the odds branch
        run: |
          grep -q 'same version' /tmp/odds.log && exit 0
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          du -sh data/odds
          mv data/odds /tmp/odds-out
          git checkout --orphan odds-new && git rm -rfq . && mkdir -p data && mv /tmp/odds-out data/odds
          git add data/odds && git commit -qm "Probabilità ufficiali (server coreano)" && git push -f origin odds-new:odds

