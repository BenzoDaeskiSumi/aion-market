name: Publish site
# The site = the code on main + the data on the 'data' branch (kept as a single commit, so the repository
# does not grow every hour). Published with GitHub Pages "GitHub Actions" source.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Sync prices', 'Backfill history', 'Map data']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: data, path: _data}
      - name: Map tiles (their own branch, if present)
        run: |
          git clone -q --depth 1 --branch tiles https://github.com/${{ github.repository }} _tiles || true
      - name: Assemble
        run: |
          mkdir -p data && cp -r _data/data/. data/
          if [ -d _tiles/map ]; then mkdir -p map && cp -r _tiles/map/. map/; fi
          rm -rf _data _tiles .git .github
          python3 scripts/selfhost.py index.html
          python3 scripts/selfhost.py market.html
          python3 scripts/selfhost.py privacy.html
          python3 scripts/selfhost.py overlay.html
          python3 scripts/selfhost.py map.html
          python3 scripts/selfhost.py guide.html
          python3 scripts/selfhost.py guida-spiritmaster.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
