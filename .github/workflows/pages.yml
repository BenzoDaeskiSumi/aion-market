name: Pubblica il sito
# Static site, no build step. The only thing done here is serving the supabase-js CDN script from the site itself
# (scripts/selfhost.py), so visitors' browsers never contact jsDelivr. Pages source = GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          python3 scripts/selfhost.py market.html
          rm -rf .git .github tools scripts CLAUDE.md README.md
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
