name: Probe recipes source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          mkdir -p probe
          UA='aion-market-tracker (+https://benzodaeskisumi.github.io/aion-market)'
          curl -sL -A "$UA" https://metabot.gg/en/aion-2/crafting -o probe/crafting.html
          curl -sL -A "$UA" https://metabot.gg/en/aion-2/conversion -o probe/conversion.html
          curl -s -A "$UA" -X POST https://metabot.gg/api/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' -o probe/mcp_tools.txt
          ls -la probe
      - name: Save to probe branch
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git checkout -b probe
          git add probe && git commit -qm probe && git push -f origin probe
