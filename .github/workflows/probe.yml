name: Probe NCSOFT pages
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe_api.mjs > /tmp/run.txt 2>&1 || true
      - name: Save the output on the temporary 'probe' branch
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          cp /tmp/run.txt /tmp/p.txt
          git checkout --orphan probe && git rm -rfq . && cp /tmp/p.txt probe.txt
          git add probe.txt && git commit -qm "probe output" && git push -f origin probe
