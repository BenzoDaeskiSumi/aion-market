name: Probe NCSOFT dictionary
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_ncsoft.py > /tmp/probe.txt 2>&1 || true
      - name: Save the output on a temporary 'probe' branch
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git checkout --orphan probe && git rm -rfq . && cp /tmp/probe.txt probe.txt; cp /tmp/items_en.json . 2>/dev/null || true
          git add -A && git commit -qm "probe output" && git push -f origin probe
