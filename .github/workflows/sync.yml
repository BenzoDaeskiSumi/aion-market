name: Sync prices
on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (backup; cron-job.org triggers it at :00)
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write      # to start 'Andamento prezzi' on Wednesday (GitHub's own schedule skipped it)
concurrency:
  group: sync-prices
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4      # the data lives on the 'data' branch, as one commit
        with: {ref: data, path: _data}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cp -r _data/data/. data/
      - run: python -m unittest scripts/test_summary.py
      - run: set -o pipefail; python -u scripts/sync.py 2>&1 | tee /tmp/sync_log.txt
      - name: Save the data (replaces the single commit of the data branch; Publish site runs after this)
        run: |
          rsync -a --delete data/s/ _data/data/s/
          cp data/catalog.json data/servers.json _data/data/
          tail -c 20000 /tmp/sync_log.txt > _data/data/sync_log.txt   # last run's output, readable without the Actions log
          cd _data
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git checkout -q --orphan fresh
          git add -A
          git commit -qm "Dati del Market $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin fresh:data
      - name: Wednesday after maintenance, start 'Andamento prezzi' once (GitHub's schedule for it is not reliable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Europe/Rome date +%u); h=$(TZ=Europe/Rome date +%H)
          if [ "$d" = 3 ] && [ "$h" -ge 13 ]; then
            since=$(TZ=Europe/Rome date -d 'today 12:00' -u +%FT%TZ)
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow prezzi.yml --limit 5 --json createdAt -q "[.[] | select(.createdAt >= \"$since\")] | length")
            [ "${n:-0}" = 0 ] && gh workflow run prezzi.yml -R "$GITHUB_REPOSITORY" --ref main && echo "started Andamento prezzi" || echo "already ran this week ($n)"
          fi
