name: Sync prices
on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-prices
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync.py
      - name: Commit if changed
        run: |
          git config user.name "BenzoDaeskiSumi"
          git config user.email "173538282+BenzoDaeskiSumi@users.noreply.github.com"
          git add data/price_log.json data/meta.json data/crafts.json
          git diff --cached --quiet || (git commit -m "Prezzi aggiornati da aion2.exchange" && git pull --rebase && git push)
