name: Tests
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Price signals (scripts/test_summary.py)
        run: python -m unittest scripts/test_summary.py
      - name: Scripts compile
        run: python -m py_compile scripts/*.py
      - name: Page and bot scripts parse
        run: for f in js/*.js bot/src/index.js; do node --check "$f" || exit 1; done
