name: Verify bot
on:
  push:
    branches: [main]
    paths: ['verify/**', '.github/workflows/verify.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Deploy the Worker to Cloudflare
        working-directory: verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBKEY: ${{ secrets.VERIFY_PUBLIC_KEY }}
          TOKEN: ${{ secrets.VERIFY_DISCORD_TOKEN }}
        run: |
          report() { tail -n 25 "$1" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r l; do echo "::$2::$l"; done; }
          [ -n "$PUBKEY" ] || { echo "::error::secret VERIFY_PUBLIC_KEY missing"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::secret VERIFY_DISCORD_TOKEN missing"; exit 1; }
          kvid() { npx -y wrangler@4 kv namespace list 2>/dev/null | jq -r '[.[] | select(.title | endswith("marchutan-verifica-kv"))][0].id // empty'; }
          id=$(kvid)
          if [ -z "$id" ]; then npx -y wrangler@4 kv namespace create marchutan-verifica-kv > kv.txt 2>&1 || report kv.txt error; id=$(kvid); fi
          [ -n "$id" ] || { echo "::error::KV namespace missing"; exit 1; }
          printf '\n[[kv_namespaces]]\nbinding = "USERS"\nid = "%s"\n' "$id" >> wrangler.toml
          npx -y wrangler@4 deploy > deploy.txt 2>&1 || true
          if ! grep -q 'workers.dev' deploy.txt || grep -q 'ERROR' deploy.txt; then report deploy.txt error; exit 1; fi
          grep -o 'https://[^ ]*workers.dev' deploy.txt | head -1 | sed 's/^/::notice::Interactions Endpoint URL /'
          printf '%s' "$PUBKEY" | npx -y wrangler@4 secret put DISCORD_PUBLIC_KEY > s.txt 2>&1 || { report s.txt error; exit 1; }
          printf '%s' "$TOKEN" | npx -y wrangler@4 secret put DISCORD_TOKEN > s.txt 2>&1 || { report s.txt error; exit 1; }
      - name: Register the slash commands
        run: node verify/register.mjs 2>&1 | tee reg.txt; s=${PIPESTATUS[0]}; [ $s -eq 0 ] || sed 's/^/::error::/' reg.txt; exit $s
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.VERIFY_DISCORD_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.VERIFY_APP_ID }}
